[package]
name = "qinfang"
version = "0.1.0"
description = "琴房 · 吉他练习：节拍器、看谱、效果器"
edition = "2021"
license = "MIT"
repository = "https://github.com/W1ght/qinfang"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = { version = "0.18", features = ["asio"] }
ringbuf = "0.5"
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
