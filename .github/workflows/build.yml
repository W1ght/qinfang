name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # asio-sys 编译 ASIO SDK 需要 MSVC 环境变量
      - uses: ilammy/msvc-dev-cmd@v1

      # bindgen 需要 libclang；Runner 镜像一般自带 LLVM，没有就装一个
      - name: 准备 LLVM
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          "CLANG_PATH=$llvm\clang.exe" >> $env:GITHUB_ENV

      - name: 安装依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - name: Rust 测试（DSP 与音频分析）
        working-directory: src-tauri
        run: cargo test --release

      - name: 打包
        run: npx tauri build

      - name: 整理安装包
        id: pkg
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $src = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          # Release 附件名用 ASCII，避免中文文件名被 GitHub 改写
          $name = "Qinfang_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $src.FullName "dist/$name"
          Copy-Item src-tauri/target/release/qinfang.exe "dist/Qinfang_${version}_x64-portable.exe"
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: qinfang-${{ steps.pkg.outputs.version }}-windows-x64
          path: dist/*.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag.TrimStart('v') -ne '${{ steps.pkg.outputs.version }}') {
            throw "标签 $tag 与 tauri.conf.json 版本 ${{ steps.pkg.outputs.version }} 不一致"
          }
          $files = (Get-ChildItem dist/*.exe).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @files --clobber }
          else { gh release create $tag @files --title "琴房 $tag" --generate-notes }
